{% extends "home.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/add_memorization.css' %}">

{% block css %}

<link rel="stylesheet" href="{% static 'css/add_student.css' %}">

{% endblock %}

{% block body %}
<main>
    <div class="form">
        <form method="post">
            {% csrf_token %}
            <div class="profile">
                {{form.first_name}}
                {{form.middle_name}}
                {{form.last_name}}
            </div>
            <div class="student">
                <input type="date" required name="date_of_birth">
                {{form.guardian_phone}}
            </div>
            {%if messages%}
            {%for message in messages%}
            <span class="{{message.tags}}-message">{{message}}</span>
            {% endfor %}
            {% endif %}
            <button class="submit-button">أضافة الطالب</button>

    </div>
    </form>
</main>
{% endblock %}
